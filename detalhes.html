<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaFácil - Detalhes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <h1>AgendaFácil</h1>

        <nav>
            <a href="index.html">Calendário</a>
            <a href="cadastro.html">Nova tarefa</a>
        </nav>
    </header>

    <main>
        <section class="intro">
            <h2>Detalhes da tarefa</h2>
            <p>Veja as informações da tarefa selecionada.</p>
        </section>

        <!-- Detalhes da tarefa -->
        <article class="detalhes">
            <span class="categoria">Estudos</span>

            <h3>Prova de Cálculo</h3>

            <p><strong>Data:</strong> 10/09/2026</p>
            <p><strong>Horário:</strong> 19:00</p>

            <div class="descricao">
                <strong>Descrição:</strong>
                <p>Prova referente ao conteúdo da primeira unidade.</p>
            </div>

            <!-- Botões -->
            <div class="botoes">
                <a class="botao cancelar" href="index.html">Voltar</a>
                <a class="botao" href="cadastro.html">Editar</a>
                <button class="botao concluida" type="button">
                    Marcar como concluída
                </button>
                <button class="botao excluir" type="button">Excluir</button>
            </div>
        </article>
    </main>

    <footer>
        <p>AgendaFácil - Organize seu dia</p>
    </footer>

</body>
</html>
