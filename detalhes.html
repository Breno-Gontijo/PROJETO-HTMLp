<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaFácil - Detalhes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AgendaFácil</h1>
        <nav>
            <a href="index.html">Calendário</a>
            <a href="cadastro.html">Nova tarefa</a>
        </nav>
    </header>

    <main>
        <section class="intro">
            <h2>Detalhes da tarefa</h2>
            <p>Veja as informações da tarefa selecionada.</p>
        </section>

        <article class="detalhes">
            <span id="categoriaDetalhes" class="categoria">Estudos</span>
            <h3 id="tituloDetalhes">Tarefa</h3>

            <p><strong>Data:</strong> <span id="dataDetalhes"></span></p>
            <p><strong>Horário:</strong> <span id="horarioDetalhes"></span></p>

            <div class="descricao">
                <strong>Descrição:</strong>
                <p id="descricaoDetalhes"></p>
            </div>

            <p id="mensagemDetalhes" class="mensagem"></p>

            <div class="botoes">
                <a class="botao cancelar" href="index.html">Voltar</a>
                <button id="concluir" class="botao concluida">Marcar como concluída</button>
                <button id="excluir" class="botao excluir">Excluir</button>
            </div>
        </article>
    </main>

    <footer>
        <p>AgendaFácil - Organize seu dia</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
